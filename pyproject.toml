[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="u-mirage"
version="0.1.0"
description="Source-aware uncertainty propagation for multi-image VLM reasoning"
requires-python=">=3.10"
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.6"]
vlm=["torch>=2.4","transformers>=4.55","accelerate>=1.0","pillow>=10","pyyaml>=6"]
data=["datasets>=3","pyyaml>=6"]

[project.scripts]
umirage="umirage.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]

[tool.ruff]
line-length=110
target-version="py310"
