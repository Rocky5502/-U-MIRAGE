[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u-mirage"
version = "0.2.0"
description = "Source-aware uncertainty propagation for reliable multi-image vision-language reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
vlm = [
  "torch>=2.4",
  "transformers>=4.57",
  "accelerate>=1.0",
  "datasets>=3.0",
  "pillow>=10",
  "qwen-vl-utils>=0.0.8",
]
data = ["datasets>=3.0", "pillow>=10", "huggingface-hub>=0.25"]
analysis = ["pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.9"]
api = [
  "openai>=1.0",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "huggingface-hub>=0.25",
]

[project.scripts]
umirage = "umirage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
