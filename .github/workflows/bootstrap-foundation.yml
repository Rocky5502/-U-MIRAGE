name: Bootstrap research foundation

on:
  push:
    paths:
      - '.github/workflows/bootstrap-foundation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize locally-tested foundation
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part1.b64 .bootstrap/part2.b64 .bootstrap/part3.b64 > /tmp/foundation.b64
          base64 -d /tmp/foundation.b64 > /tmp/foundation.tgz
          tar -xzf /tmp/foundation.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-foundation.yml
      - name: Commit foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: establish U-MIRAGE research foundation'
          git push
